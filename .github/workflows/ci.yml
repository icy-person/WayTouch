name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waytouch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Linux build and regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            make \
            curl \
            unzip \
            zip \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-randr0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-xinput0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK packages
        run: |
          sdkmanager --install \
            'platforms;android-37.0' \
            'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Prepare project-local developer tools
        run: make setup

      - name: Verify build environment
        run: make doctor

      - name: Build and run regression checks
        run: make build

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: waytouch-linux-build
          if-no-files-found: error
          retention-days: 14
          path: |
            rust-host/target/release/waytouch-host
            android-server/build/waytouch-server.jar
            android-server/build/dex/classes.dex
            android-editor/build/waytouch-editor.apk
